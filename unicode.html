<head>

    <style>

            font-family: Arial, Helvetica, sans-serif;

            text-align: center;

        header h1 {

        nav {
            width: 220px;

            padding: 25px 15px;
            border-right: 1px solid #ddd;
        }

        nav h3 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        nav a {
            display: block;
            text-decoration: none;
            color: #333;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            transition: 0.2s;
        }

        nav a:hover {

        main {
            flex: 1;

            background-color: #eaf4ff;
            text-align: center;
        }

        main h2 {
            margin-top: 0;
            font-size: 30px;
        }

        main p {
            line-height: 1.6;
        }

        .card {
            max-width: 900px;
            margin: 25px auto;
            padding: 25px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .box {
            max-width: 600px;
            margin: 25px auto;
            padding: 25px;
            background-color: #fff;
            border: 2px solid #333;
            border-radius: 10px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            max-width: 350px;
            padding: 12px;
            border: 2px solid #aaa;

        }

        button {
            margin: 12px 5px 5px;
            padding: 10px 18px;
            background-color: white;
            color: #222;
            border: 2px solid #333;
            border-radius: 6px;

            font-size: 15px;
        }

        button:hover {
            background-color: #333;

        }

        .result {
            margin-top: 18px;
            padding: 15px;

            background-color: #f4f6f8;

        .unicode-images {

        footer {

    </style>
</head>

<body>

    <header>
        <h1>Fundamentals of Computing</h1>
        <p>My Computing Course Website</p>
    </header>

    <div class="container">

        <nav>
            <h3>Menu</h3>

            <a href="index2.html">Course</a>
            <a href="project.html">Project</a>
            <a href="concepts.html">Concepts</a>
            <a href="database.html">Databases</a>
            <a href="documentation.html">Documentation</a>
            <a href="aboutme1.html">Dev Team</a>
        </nav>

        <main>
            <h2>UNICODE Converter</h2>

            <div class="card">
                <p>Enter a hexadecimal UNICODE value to display its character.</p>

                <div class="box">
                    <label for="u">Enter UNICODE hexadecimal value:</label>
                    <input id="u" placeholder="Example: 1F600">
                    <br>
                    <button onclick="go()">Submit</button>

                    <div id="r" class="result">UNICODE Value:</div>
                </div>

                <div class="unicode-images">
                    <img src="uni1.jpg" alt="UNICODE examples">
                    <img src="uni3.jpg" alt="UNICODE chart">
                    <img src="uni4.jpg" alt="UNICODE characters">
                </div>
            </div>
        </main>

    </div>

    <footer>
        <p>@ Byron Coc | Fundamentals of Computing</p>
    </footer>

    <script>
        function go() {
            let x = document.getElementById('u').value.trim().replace(/^U\+|^0x/i, '');
            let r = document.getElementById('r');

            if (!/^[0-9a-fA-F]{1,6}$/.test(x)) {
                r.textContent = 'Please enter a valid hexadecimal UNICODE value.';
                return;
            }

            let n = parseInt(x, 16);

            if (n > 0x10FFFF) {
                r.textContent = 'That UNICODE value is outside the valid range.';
                return;
            }

            r.textContent = 'UNICODE Value: ' + String.fromCodePoint(n) +
                ' (U+' + n.toString(16).toUpperCase().padStart(4, '0') + ')';
        }
    </script>

</body>

</html>

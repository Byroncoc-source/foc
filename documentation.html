    <style>

        body {

        header {

        nav h3 {

        }

        nav a {
            display: block;
            text-decoration: none;
            color: #333;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            transition: 0.2s;
        }

        nav a:hover {
            background-color: #333;
            color: white;
        }

        main {
            flex: 1;
            padding: 35px;
            background-color: #eaf4ff;
            text-align: center;
        }

        main h2 {
            margin-top: 0;
            font-size: 30px;
        }

        main p {
            line-height: 1.6;
        }



        .documentation-image img {
            width: 515px;
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            border: 2px solid #333;
            transition: 0.2s;

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }

        footer p {
            margin: 0;
        }

        @media (max-width: 700px) {

            .container {
                flex-direction: column;
            }

            nav {
                width: 100%;
                border-right: none;
            }

        }

    </style>

</head>

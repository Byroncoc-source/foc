<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Binary to Hexadecimal - Fundamentals of Computing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            color: #222;
        }

        header {
            background-color: #333;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 15px;
        }

        .container {
            display: flex;
            min-height: 500px;
        }

        nav {
            width: 220px;
            background-color: white;
            padding: 25px 15px;
            border-right: 1px solid #ddd;
        }

        nav h3 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        nav a {
            display: block;
            text-decoration: none;
            color: #333;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            transition: 0.2s;
        }

        nav a:hover {
            background-color: #333;
            color: white;
        }

        main {
            flex: 1;
            padding: 35px;
            background-color: #eaf4ff;
            text-align: center;
        }

        main h2 {
            margin-top: 0;
            font-size: 30px;
        }

        main p {
            line-height: 1.6;
        }

        .card {
            max-width: 900px;
            margin: 25px auto;
            padding: 25px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .project-image {
            display: block;
            max-width: 100%;
            width: 430px;
            height: auto;
            margin: 15px auto 25px;
            border-radius: 8px;
            border: 2px solid #333;
        }

        .box {
            max-width: 600px;
            margin: 25px auto;
            padding: 25px;
            background-color: #fff;
            border: 2px solid #333;
            border-radius: 10px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            max-width: 350px;
            padding: 12px;
            border: 2px solid #aaa;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            margin: 12px 5px 5px;
            padding: 10px 18px;
            background-color: white;
            color: #222;
            border: 2px solid #333;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #333;
            color: white;
        }

        .result {
            margin-top: 18px;
            padding: 15px;
            min-height: 50px;
            background-color: #f4f6f8;
            border-radius: 6px;
            font-weight: bold;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }

        footer p {
            margin: 0;
        }

        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }

            nav {
                width: 100%;
                border-right: none;
            }

            main {
                padding: 25px 12px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Fundamentals of Computing</h1>
        <p>My Computing Course Website</p>
    </header>

    <div class="container">

        <nav>
            <h3>Menu</h3>

            <a href="index2.html">Course</a>
            <a href="project.html">Project</a>
            <a href="concepts.html">Concepts</a>
            <a href="database.html">Databases</a>
            <a href="documentation.html">Documentation</a>
            <a href="aboutme1.html">Dev Team</a>
        </nav>

        <main>
            <h2>Binary to Hexadecimal Converter</h2>

            <div class="card">
                <p>Enter a 4-digit binary number to convert it to its hexadecimal value.</p>

                <img src="bintohex.jpg" alt="Binary to hexadecimal chart" class="project-image">

                <div class="box">
                    <label for="b">Enter any 4 digit binary number:</label>
                    <input id="b" maxlength="4" placeholder="Example: 1010">
                    <br>
                    <button onclick="go()">Submit</button>

                    <div id="r" class="result">Hexadecimal Value:</div>
                </div>
            </div>
        </main>

    </div>

    <footer>
        <p>@ Byron Coc | Fundamentals of Computing</p>
    </footer>

    <script>
        function go() {
            let x = document.getElementById('b').value.trim();
            let r = document.getElementById('r');

            if (!/^[01]{4}$/.test(x)) {
                r.textContent = 'Please enter exactly 4 binary digits (0 or 1).';
                return;
            }

            r.textContent = 'Hexadecimal Value: ' + parseInt(x, 2).toString(16).toUpperCase();
        }
    </script>

</body>

</html>
